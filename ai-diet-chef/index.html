<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AI 减脂厨师 | 智能搭配你的每一餐</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-wrapper">
  <!-- Hero -->
  <header class="app-hero">
    <div class="logo">🥗 AI 减脂厨师</div>
    <div class="header-sub">不知道吃什么？告诉我食材，帮你搭配健康餐</div>
    <div class="hero-stats-row">
      <div class="hero-stat"><div class="hs-num">50+</div><div class="hs-label">精选菜谱</div></div>
      <div class="hero-stat"><div class="hs-num">3餐</div><div class="hs-label">智能搭配</div></div>
      <div class="hero-stat"><div class="hs-num">0卡</div><div class="hs-label">热量精准</div></div>
    </div>
  </header>

  <!-- 输入区 -->
  <section class="main-card">
    <div class="input-row">
      <input
        type="text"
        id="ingredientInput"
        class="ingredient-input"
        placeholder="输入食材名称，如：鸡胸肉、西兰花..."
        autocomplete="off"
      />
      <button class="btn-add" id="btnAdd">+添加</button>
    </div>
    <div class="tags-area" id="tagsArea"></div>

    <!-- 快捷食材 -->
    <div class="quick-row">
      <span class="quick-label">常用：</span>
      <span class="quick-chip" data-ingredient="鸡胸肉">鸡胸肉</span>
      <span class="quick-chip" data-ingredient="鸡蛋">鸡蛋</span>
      <span class="quick-chip" data-ingredient="西兰花">西兰花</span>
      <span class="quick-chip" data-ingredient="番茄">番茄</span>
      <span class="quick-chip" data-ingredient="虾仁">虾仁</span>
      <span class="quick-chip" data-ingredient="牛肉">牛肉</span>
      <span class="quick-chip" data-ingredient="豆腐">豆腐</span>
      <span class="quick-chip" data-ingredient="燕麦">燕麦</span>
    </div>

    <!-- 身材档案 -->
    <div class="profile-section">
      <div class="profile-header" onclick="this.classList.toggle('open');document.getElementById('profileBody').classList.toggle('open')">
        <span class="ph-left"><span class="ph-icon">👤</span> 身材档案，精准推荐</span>
        <span class="ph-arrow">▾</span>
      </div>
      <div class="profile-body" id="profileBody">
        <div class="pf-row">
          <div class="pf-item">
            <label>性别</label>
            <div class="pf-radio-group">
              <button class="pf-radio active" data-gender="male" onclick="App.setGender('male',this)">👨 男</button>
              <button class="pf-radio" data-gender="female" onclick="App.setGender('female',this)">👩 女</button>
            </div>
          </div>
          <div class="pf-item">
            <label>年龄</label>
            <input type="number" id="pfAge" placeholder="25" class="pf-input">
          </div>
        </div>
        <div class="pf-row">
          <div class="pf-item">
            <label>身高 (cm)</label>
            <input type="number" id="pfHeight" placeholder="170" class="pf-input">
          </div>
          <div class="pf-item">
            <label>体重 (kg)</label>
            <input type="number" id="pfWeight" placeholder="65" class="pf-input">
          </div>
        </div>
        <div class="pf-result" id="pfResult" style="display:none"></div>
      </div>
    </div>

    <!-- 偏好 -->
    <div class="pref-row">
      <span class="pref-label">🎯 偏好</span>
      <button class="pref-btn active" data-category="all">全部</button>
      <button class="pref-btn" data-category="diet">🥗 减脂</button>
      <button class="pref-btn" data-category="cheat">🍕 放纵</button>
    </div>

    <div class="btn-row">
      <button class="btn-search" id="btnSearch">
        <span class="sparkle">✨</span> AI 推荐菜谱
      </button>
      <button class="btn-mealplan" id="btnMealPlan">
        📅 一键今日菜单
      </button>
    </div>
  </section>

  <!-- 结果区 -->
  <section class="results-section" id="resultsSection">
    <div class="results-header" id="resultsHeader" style="display:none;">
      <span id="resultsCount"></span>
      <span class="ai-badge">🤖 AI 匹配</span>
    </div>
    <div class="results-grid" id="resultsGrid"></div>
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">🥬</div>
      <div class="empty-title">输入食材或直接点按钮</div>
      <div class="empty-desc">可以输入食材让 AI 搭配<br>也可以直接点「AI 一键推荐」随机生成菜谱</div>
    </div>
  </section>

  <!-- 详情弹窗 -->
  <div class="modal-overlay" id="modalOverlay" style="display:none;">
    <div class="modal-content" id="modalContent"></div>
  </div>
</div>

<script src="recipes.js"></script>
<script src="app.js"></script>
</body>
</html>
